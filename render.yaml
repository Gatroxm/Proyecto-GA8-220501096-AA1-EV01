# Blueprint de Render para GatroxM.dev
# Despliega el backend (Web Service) y el frontend (Static Site) en un solo paso.
# Uso: Render Dashboard -> New + -> Blueprint -> seleccionar este repositorio.
services:
  - type: web
    name: gatroxm-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Se solicita en el dashboard de Render, nunca se guarda en Git.
      - key: MONGODB_URI
        sync: false
      # Debe coincidir exactamente con la URL del frontend desplegado.
      - key: CORS_ORIGIN
        value: https://gatroxm-frontend.onrender.com

  - type: web
    name: gatroxm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      # Necesario para que Angular Router funcione al recargar rutas.
      - type: rewrite
        source: /*
        destination: /index.html
